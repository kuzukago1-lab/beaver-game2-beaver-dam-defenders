            ctx.stroke();

            ctx.fillStyle = legColor;
            ctx.beginPath(); ctx.arc(21, 10, 4, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
            ctx.beginPath(); ctx.arc(49, 10, 4, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

            ctx.fillStyle = "#1a0c04";
            if (gameOver) {
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                ctx.moveTo(26, 16); ctx.lineTo(32, 22);
                ctx.moveTo(32, 16); ctx.lineTo(26, 22);
                ctx.moveTo(38, 16); ctx.lineTo(44, 22);
                ctx.moveTo(44, 16); ctx.lineTo(38, 22);
                ctx.stroke();
            } else if (beaver.isBlinking) {
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(26, 18); ctx.lineTo(32, 18);
                ctx.moveTo(38, 18); ctx.lineTo(44, 18);
                ctx.stroke();
            } else {
                ctx.beginPath();
                ctx.arc(29, 18, 2.5, 0, Math.PI * 2);
                ctx.arc(41, 18, 2.5, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.fillStyle = "#e8b070";
            ctx.beginPath();
            ctx.ellipse(35, 25, 9, 7, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = "#111";
            ctx.beginPath(); ctx.arc(35, 22, 2.5, 0, Math.PI * 2); ctx.fill();

            ctx.fillStyle = "#fff";
            ctx.fillRect(33, 27, 4, 6);
            ctx.strokeStyle = outlineColor;
            ctx.lineWidth = 1;
            ctx.strokeRect(33, 27, 4, 6);

            ctx.strokeStyle = "#2b1303";
            ctx.lineWidth = 1.5;
            ctx.lineCap = "round";

            let leftWhiskers = [
                { startX: 27, startY: 23, cpX: 18, cpY: 24, endX: 10, endY: 28 },
                { startX: 26, startY: 25, cpX: 17, cpY: 27, endX: 9,  endY: 32 },
                { startX: 26, startY: 27, cpX: 17, cpY: 30, endX: 10, endY: 36 },
                { startX: 27, startY: 29, cpX: 18, cpY: 33, endX: 12, endY: 40 }
            ];
            leftWhiskers.forEach(w => {
                ctx.beginPath();
                ctx.moveTo(w.startX, w.startY);
                ctx.quadraticCurveTo(w.cpX, w.cpY, w.endX, w.endY);
                ctx.stroke();
            });

            let rightWhiskers = [
                { startX: 43, startY: 23, cpX: 52, cpY: 24, endX: 60, endY: 28 },
                { startX: 44, startY: 25, cpX: 53, cpY: 27, endX: 61, endY: 32 },
                { startX: 44, startY: 27, cpX: 53, cpY: 30, endX: 60, endY: 36 },
                { startX: 43, startY: 29, cpX: 52, cpY: 33, endX: 58, endY: 40 }
            ];
            rightWhiskers.forEach(w => {
                ctx.beginPath();
                ctx.moveTo(w.startX, w.startY);
                ctx.quadraticCurveTo(w.cpX, w.cpY, w.endX, w.endY);
                ctx.stroke();
            });

            if (woodCount === 0) {
                ctx.fillStyle = armColor;
                ctx.strokeStyle = outlineColor;
                ctx.lineWidth = strokeWidth;

                ctx.beginPath();
                ctx.ellipse(18, 42, 5, 4, -0.3, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                ctx.beginPath();
                ctx.ellipse(52, 42, 5, 4, 0.3, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
            }

            if (woodCount >= 1) {
                ctx.save();
                ctx.translate(14, 24);
                ctx.fillStyle = "#8B4513";
                ctx.beginPath();
                ctx.roundRect(0, 0, 42, 16, 5);
                ctx.fill();
                ctx.strokeStyle = outlineColor;
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.fillStyle = "#e3b782";
                ctx.beginPath();
                ctx.ellipse(42, 8, 4, 8, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = outlineColor;
                ctx.lineWidth = 1;
                ctx.stroke();
                ctx.restore();

                ctx.fillStyle = armColor;
                ctx.strokeStyle = outlineColor;
                ctx.lineWidth = strokeWidth;

                ctx.beginPath();
                ctx.ellipse(22, 43, 5, 6, -0.2, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                ctx.beginPath();
                ctx.ellipse(46, 36, 5, 6, 0.2, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
            }

            if (woodCount >= 2) {
                let stackCount = Math.min(3, woodCount - 1);
                for (let i = 0; i < stackCount; i++) {
                    let boxY = -6 - (i * 12);
                    ctx.save();
                    ctx.translate(17, boxY);
                    ctx.fillStyle = "#8B4513";
                    ctx.beginPath();
                    ctx.roundRect(0, 0, 36, 11, 4);
                    ctx.fill();
                    ctx.strokeStyle = outlineColor;
                    ctx.lineWidth = 1.5;
                    ctx.stroke();
                    ctx.fillStyle = "#e3b782";
                    ctx.beginPath();
                    ctx.ellipse(36, 5.5, 3, 5.5, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();
                    ctx.restore();
                }
            }

            ctx.restore();
            ctx.restore();
        }

        function drawHedgehog(enemy) {
            ctx.save();
            ctx.translate(enemy.x, enemy.y);

            if (enemy.dir === -1) {
                ctx.translate(44, 0);
                ctx.scale(-1, 1);
            }

            let legOffset1 = Math.sin(enemy.walkTimer) * 2;

            ctx.fillStyle = "#5c3a21";
            ctx.strokeStyle = "#2b1303";
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.ellipse(10 + legOffset1, 23, 3, 2.5, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            ctx.beginPath();
            ctx.ellipse(26 - legOffset1, 23, 3, 2.5, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = "#8c6239";
            ctx.beginPath();
            ctx.ellipse(-2, 15, 5, 2.5, 0.2, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = "#3b2817";
            ctx.lineWidth = 1;
            ctx.stroke();

            ctx.fillStyle = "#4a3b32";
            ctx.beginPath();
            ctx.moveTo(-4, 12);
            ctx.lineTo(-8, 3);
            ctx.lineTo(1, 10);
            ctx.fill();

            for (let i = 0; i < 6; i++) {
                ctx.beginPath();
                ctx.moveTo(2 + i * 6, 10);
                ctx.lineTo(5 + i * 6, -5);
                ctx.lineTo(9 + i * 6, 10);
                ctx.fill();
            }

            ctx.fillStyle = "#8c6239";
            ctx.beginPath();
            ctx.ellipse(20, 14, 18, 11, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = "#3b2817";
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.fillStyle = "#d4a373";
            ctx.beginPath();
            ctx.arc(32, 13, 7, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = "#111";
            if (enemy.isBlinking) {
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(32.5, 10.5); ctx.lineTo(35.5, 10.5);
                ctx.moveTo(36.5, 13.5); ctx.lineTo(39.5, 13.5);
                ctx.stroke();
            } else {
                ctx.beginPath();
                ctx.arc(34, 11, 1.5, 0, Math.PI * 2);
                ctx.arc(38, 14, 2, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.restore();
        }

        /* =========================================================
           9b. ダムからの距離に応じたニンジン出現＆金の大きなニンジン
           ========================================================= */
        function pickWeightedCarrotX() {
            let minX = 120;
            let maxX = damX - 90;
            let bestX = minX + Math.random() * (maxX - minX);

            let candidateX = minX + Math.random() * (maxX - minX);
            if (Math.abs(damX - candidateX) > Math.abs(damX - bestX)) {
                bestX = candidateX;
            }
            return bestX;
        }

        function spawnRandomCarrot() {
            if (carrots.length >= 3) return;

            let rx = pickWeightedCarrotX();
            let distFromDam = Math.max(0, damX - rx);
            let distRatio = Math.min(1, distFromDam / (damX - 120));

            let isGolden = Math.random() < (0.15 + distRatio * 0.25);
            let ry = (Math.random() < 0.65) ? (isGolden ? 262 : 272) : (185 + Math.random() * 40);

            carrots.push({
                x: rx,
                y: ry,
                width: isGolden ? 50 : 32,
                height: isGolden ? 31 : 20,
                isGolden: isGolden,
                timer: 0,
                life: isGolden ? 720 : 600
            });
        }

        /* =========================================================
           10. メイン更新ループ
           ========================================================= */
        function updateBabyBeavers() {
            let maxBlocks = 10;
            let currentBlocks = Math.max(0, Math.ceil((damHp / 100) * maxBlocks));
            let totalWoodHeight = currentBlocks * 10;
            let waterOffset = (damHp > 0) ? 6 : 0;
            let currentWaterHeight = Math.max(0, totalWoodHeight - waterOffset);
            let targetBaseY = (currentWaterHeight > 10) ? (300 - currentWaterHeight - 25) : 262;

            babyBeavers.forEach((baby, index) => {
                baby.blinkTimer++;
                if (!baby.isBlinking && baby.blinkTimer > 100 + index * 30) {
                    baby.isBlinking = true;
                    baby.blinkTimer = 0;
                } else if (baby.isBlinking && baby.blinkTimer > 12) {
                    baby.isBlinking = false;
                    baby.blinkTimer = 0;
                }

                baby.x += baby.vx;
                baby.walkTimer += 0.15;
                if (baby.x < damX + 55) { baby.x = damX + 55; baby.vx = Math.abs(baby.vx); baby.facing = 1; }
                else if (baby.x > worldWidth - 65) { baby.x = worldWidth - 65; baby.vx = -Math.abs(baby.vx); baby.facing = -1; }
                else if (Math.random() < 0.01) { baby.vx *= -1; baby.facing = (baby.vx > 0) ? 1 : -1; }

                let bobbing = (currentWaterHeight > 10) ? Math.sin(Date.now() * 0.005 + index) * 2 : 0;
                baby.y += ((targetBaseY + bobbing) - baby.y) * 0.15;
            });
        }

        function update(now) {
            frameTailHitCount = 0;

            if (nightModeMsgTimer > 0) nightModeMsgTimer--;
            if (rankUpBannerTimer > 0) rankUpBannerTimer--;

            if (gameOver) {
                if (!gameOverSoundPlayed) {
                    gameOverSoundPlayed = true;
                    timerRunning = false;
                    finalTimeString = formatTime(survivalTimeMs);
                    updateStartButtonState();
                    playGameOverSound();

                    if (!scoreRegistered && !gameOverModalTriggered) {
                        gameOverModalTriggered = true;
                        gameOverModalTimeoutId = setTimeout(() => {
                            gameOverModalTimeoutId = null;
                            if (gameOver) openRankingModal(true);
                        }, 900);
                    }
                }
                return;
            }

            if (!gameStarted || isTabPaused) {
                lastTickTime = now;
                return;
            }

            if (lastTickTime === 0) {
                lastTickTime = now;
            }
            let rawDelta = now - lastTickTime;
            lastTickTime = now;
            let safeDelta = Math.max(0, Math.min(50, rawDelta));
            let frameScale = safeDelta / (1000 / 60);

            if (timerRunning) {
                survivalTimeMs += safeDelta;
                let newRankIndex = getRankIndexFromMs(survivalTimeMs);
                if (newRankIndex > currentRankIndex) {
                    currentRankIndex = newRankIndex;
                    rankUpBannerText = BEAVER_RANKS[currentRankIndex];
                    rankUpBannerTimer = 180;
                    highlightActiveRankChip();
                    playRankUpSound();
                }
            }

            updateBGM();
            updateBabyBeavers();

            beaver.blinkTimer++;
            if (!beaver.isBlinking && beaver.blinkTimer > 120 + Math.random() * 180) {
                beaver.isBlinking = true;
                beaver.blinkTimer = 0;
            } else if (beaver.isBlinking && beaver.blinkTimer > 12) {
                beaver.isBlinking = false;
                beaver.blinkTimer = 0;
            }

            if (beaver.tailAttackTimer > 0) beaver.tailAttackTimer--;
            if (beaver.tailCooldown > 0) beaver.tailCooldown--;

            tailShockwaves.forEach(sw => {
                sw.x += sw.dir * 4.5 * frameScale;
                sw.radius += 3.2 * frameScale;
                sw.alpha -= 0.07 * frameScale;
            });
            tailShockwaves = tailShockwaves.filter(sw => sw.alpha > 0);

            knockedEnemies.forEach(ke => {
                ke.x += ke.vx * frameScale;
                ke.y += ke.vy * frameScale;
                ke.vy += 0.55 * frameScale;
                ke.rot += ke.vRot * frameScale;
                ke.life--;
            });
            knockedEnemies = knockedEnemies.filter(ke => ke.life > 0);

            if (Math.random() < 0.25) {
                buildSparkles.push({
                    x: damX - 10 + Math.random() * 60,
                    y: 295 - Math.random() * 40,
                    vy: -0.6 - Math.random() * 1.2,
                    size: 4 + Math.random() * 4,
                    alpha: 1.0,
                    life: 40 + Math.random() * 20
                });
            }
            buildSparkles.forEach(sp => { sp.y += sp.vy * frameScale; sp.alpha -= (1 / sp.life) * frameScale; });
            buildSparkles = buildSparkles.filter(sp => sp.alpha > 0);

            clouds.forEach(cloud => {
                cloud.x -= cloud.speed * frameScale;
                if (cloud.x < -100) cloud.x = worldWidth + 100;
            });

            if (showStartText) {
                startTextTimer++;
                if (startTextTimer > 75) showStartText = false;
            }

            if (timerRunning) {
                let secElapsed = Math.floor(survivalTimeMs / 1000);

                waveLevel = 1 + Math.floor(secElapsed / 15);

                let cycleStep = Math.floor(secElapsed / 30);
                if (cycleStep !== lastAutoCycleStep) {
                    lastAutoCycleStep = cycleStep;
                    toggleNightMode(true);
                }

                if (!invincibleMode) {
                    let waterWearPerFrame = (0.014 + Math.min(0.02, (waveLevel - 1) * 0.003)) * testParams.damWearMult;
                    damHp = Math.max(0, damHp - waterWearPerFrame * frameScale);
                    if (damHp <= 0) {
                        gameOver = true;
                        gameOverReason = "ダムが決壊してしまった！";
                        return;
                    }
                }
            }

            if (invincibilityTimer > 0) invincibilityTimer--;

            let beaverDistFromDam = Math.max(0, damX - beaver.x);
            let beaverDistFactor = Math.min(1, beaverDistFromDam / (damX - 120));
            let spawnThreshold = Math.round(320 - beaverDistFactor * 150);

            carrotSpawnTimer += frameScale;
            if (carrotSpawnTimer >= spawnThreshold) {
                carrotSpawnTimer = 0;
                let spawnChance = 0.55 + beaverDistFactor * 0.40;
                if (Math.random() < spawnChance) spawnRandomCarrot();
            }

            carrots.forEach(c => {
                c.timer += frameScale;
                if (beaver.x < c.x + c.width && beaver.x + beaver.width > c.x &&
                    beaver.y < c.y + c.height && beaver.y + beaver.height > c.y) {
                    if (c.isGolden) {
                        hp = maxHp;
                        c.collected = true;
                        playGoldenHealSound();
                        healEffects.push({
                            x: beaver.x + 20,
                            y: beaver.y - 18,
                            text: "✨ 体力MAX！ ✨",
                            alpha: 1.0
                        });
                    } else {
                        let healed = Math.min(maxHp - hp, 30);
                        hp = Math.min(maxHp, hp + 30);
                        c.collected = true;
                        playHealSound();
                        healEffects.push({
                            x: beaver.x + 15,
                            y: beaver.y - 15,
                            text: healed > 0 ? `+${healed} HP!` : "MAX HP!",
                            alpha: 1.0
                        });
                    }
                }
            });
            carrots = carrots.filter(c => !c.collected && c.timer < c.life);

            healEffects.forEach(he => { he.y -= 1.2 * frameScale; he.alpha -= 0.02 * frameScale; });
            healEffects = healEffects.filter(he => he.alpha > 0);
            damageEffects.forEach(de => { de.y -= 1.2 * frameScale; de.alpha -= 0.02 * frameScale; });
            damageEffects = damageEffects.filter(de => de.alpha > 0);

            let weightFactor = 1.0 - (woodCount * 0.10);
            let currentSpeed = testParams.beaverSpeed * weightFactor;
            let currentJumpForce = beaver.baseJumpForce * (1.0 - (woodCount * 0.03));

            if (keys["ArrowLeft"] || keys["KeyA"]) {
                beaver.vx = -currentSpeed;
                beaver.facing = -1;
            } else if (keys["ArrowRight"] || keys["KeyD"]) {
                beaver.vx = currentSpeed;
                beaver.facing = 1;
            } else {
                beaver.vx = 0;
            }

            if (beaver.isGrounded && beaver.vx !== 0) {
                beaver.walkTimer += 0.25 * frameScale;
            } else {
                beaver.walkTimer = 0;
            }

            if ((keys["ArrowUp"] || keys["Space"] || keys["KeyW"]) && beaver.isGrounded) {
                beaver.vy = currentJumpForce;
                beaver.isGrounded = false;
                playJumpSound();
            }

            beaver.vy += beaver.gravity * frameScale;
            beaver.rotation = (!beaver.isGrounded) ? (beaver.rotation + 0.15 * beaver.facing * frameScale) : 0;

            beaver.x += beaver.vx * frameScale;
            let blockWidth = 40;
            let currentBlocks = Math.max(0, Math.ceil((damHp / 100) * 10));
            let blockHeight = 10;

            if (currentBlocks > 0) {
                let damTopY = 300 - (currentBlocks * blockHeight);
                if (beaver.y + beaver.height > damTopY && beaver.x + beaver.width > damX && beaver.x < damX + blockWidth) {
                    if (beaver.vx > 0) beaver.x = damX - beaver.width;
                    else if (beaver.vx < 0) beaver.x = damX + blockWidth;
                }
            }

            beaver.y += beaver.vy * frameScale;
            const groundY = 300;
            beaver.isGrounded = false;

            if (beaver.y + beaver.height > groundY) {
                beaver.y = groundY - beaver.height;
                beaver.vy = 0;
                beaver.isGrounded = true;
            }

            rocks.forEach(rock => {
                if (beaver.vy >= 0 &&
                    beaver.x + beaver.width > rock.x + 8 && beaver.x < rock.x + rock.width - 8 &&
                    beaver.y + beaver.height >= rock.y && beaver.y + beaver.height <= rock.y + 18) {
                    beaver.y = rock.y - beaver.height;
                    beaver.vy = 0;
                    beaver.isGrounded = true;
                }
            });

            if (currentBlocks > 0) {
                let damTopY = 300 - (currentBlocks * blockHeight);
                if (beaver.vy >= 0 &&
                    beaver.x + beaver.width > damX && beaver.x < damX + blockWidth &&
                    beaver.y + beaver.height >= damTopY && beaver.y + beaver.height <= damTopY + 16) {
                    beaver.y = damTopY - beaver.height;
                    beaver.vy = 0;
                    beaver.isGrounded = true;
                }
            }

            if (beaver.x < 0) beaver.x = 0;
            if (beaver.x > worldWidth - beaver.width) beaver.x = worldWidth - beaver.width;

            cameraX = beaver.x - 320;
            if (cameraX < 0) cameraX = 0;
            if (cameraX > worldWidth - canvas.width) cameraX = worldWidth - canvas.width;

            woods.forEach(wood => {
                if (wood.collected) {
                    wood.respawnTimer++;
                    if (wood.respawnTimer > 210) {
                        wood.collected = false;
                        wood.respawnTimer = 0;
                    }
                } else {
                    if (woodCount < 4 &&
                        beaver.x < wood.x + 40 && beaver.x + beaver.width > wood.x &&
                        beaver.y < wood.y + 22 && beaver.y + beaver.height > wood.y) {
                        wood.collected = true;
                        woodCount += 1;
                        playWoodSound();
                    }
                }
            });

            if (woodCount > 0 && beaver.x + beaver.width >= damX - 10 && beaver.x <= damX + blockWidth + 10) {
                deliverTimer++;
                if (deliverTimer >= 16) {
                    let beforeHp = damHp;
                    damHp = Math.min(maxDamHp, damHp + 15);
                    woodCount -= 1;
                    repairCount += 1;
                    deliverTimer = 0;
                    playBuildSound();

                    let healedDam = Math.round(damHp - beforeHp);
                    healEffects.push({
                        x: damX + 20,
                        y: 200,
                        text: healedDam > 0 ? `ダム補修 +${healedDam}%!` : "ダム補強完了!",
                        alpha: 1.0
                    });
                    for (let k = 0; k < 8; k++) {
                        buildSparkles.push({
                            x: damX - 10 + Math.random() * 60,
                            y: 280 - Math.random() * 60,
                            vy: -1.5 - Math.random() * 2.0,
                            size: 6 + Math.random() * 5,
                            alpha: 1.0,
                            life: 35
                        });
                    }
                }
            } else {
                deliverTimer = 0;
            }

            if (timerRunning) {
                enemySpawnTimer++;
                let maxEnemies = Math.min(7, 2 + Math.floor(waveLevel / 2));
                let spawnInterval = testParams.fixedEnemyInterval > 0
                    ? testParams.fixedEnemyInterval
                    : Math.max(95, 220 - waveLevel * 14);
                if (enemySpawnTimer >= spawnInterval && enemies.length < maxEnemies) {
                    enemySpawnTimer = 0;
                    spawnEnemy(120 + Math.random() * 350);
                }
            }

            let tailHitbox = (beaver.tailAttackTimer > 0) ? getTailHitbox() : null;

            for (let i = enemies.length - 1; i >= 0; i--) {
                let enemy = enemies[i];
                enemy.walkTimer += 0.22 * frameScale;
                if (enemy.attackCooldown > 0) enemy.attackCooldown--;

                enemy.blinkTimer++;
                if (!enemy.isBlinking && enemy.blinkTimer > 100 + Math.random() * 150) {
                    enemy.isBlinking = true;
                    enemy.blinkTimer = 0;
                } else if (enemy.isBlinking && enemy.blinkTimer > 10) {
                    enemy.isBlinking = false;
                    enemy.blinkTimer = 0;
                }

                if (tailHitbox &&
                    tailHitbox.x < enemy.x + enemy.width &&
                    tailHitbox.x + tailHitbox.width > enemy.x &&
                    tailHitbox.y < enemy.y + enemy.height &&
                    tailHitbox.y + tailHitbox.height > enemy.y) {

                    playTailHitSound();
                    killCount++;
                    knockedEnemies.push({
                        x: enemy.x,
                        y: enemy.y,
                        vx: beaver.facing * (7 + Math.random() * 3),
                        vy: -8 - Math.random() * 3,
                        rot: 0,
                        vRot: beaver.facing * 0.35,
                        life: 45
                    });
                    damageEffects.push({
                        x: enemy.x + 15,
                        y: enemy.y - 12,
                        text: "バシッ！撃退！",
                        alpha: 1.0
                    });
                    enemies.splice(i, 1);
                    continue;
                }

                if (enemy.x + enemy.width < damX) {
                    enemy.dir = 1;
                    enemy.x += enemy.speed * frameScale;
                } else {
                    enemy.x = damX - enemy.width;
                    enemy.dir = 1;
                    if (enemy.attackCooldown === 0) {
                        enemy.attackCooldown = 55;
                        if (!invincibleMode) {
                            damHp = Math.max(0, damHp - 6);
                            playDamageSound();
                            damageEffects.push({
                                x: damX + 10,
                                y: 235,
                                text: "ダム損傷 -6%!",
                                alpha: 1.0
                            });
                            if (damHp <= 0) {
                                gameOver = true;
                                gameOverReason = "ハリネズミにダムを壊された！";
                                return;
                            }
                        } else {
                            damageEffects.push({
                                x: damX + 10,
                                y: 235,
                                text: "無敵ガード！",
                                alpha: 1.0
                            });
                        }
                    }
                }

                let margin = 6;
                if (invincibilityTimer === 0 && beaver.tailAttackTimer === 0 &&
                    beaver.x + margin < enemy.x + enemy.width && beaver.x + beaver.width - margin > enemy.x &&
                    beaver.y + margin < enemy.y + enemy.height && beaver.y + beaver.height - margin > enemy.y) {
                    if (!invincibleMode) {
                        hp = Math.max(0, hp - 20);
                        invincibilityTimer = 60;
                        playDamageSound();
                        damageEffects.push({
                            x: beaver.x + 20,
                            y: beaver.y - 15,
                            text: "-20 HP!",
                            alpha: 1.0
                        });
                        if (hp <= 0) {
                            gameOver = true;
                            gameOverReason = "ビーバーの体力が尽きてしまった！";
                            return;
                        }
                    }
                }
            }
        }

        /* =========================================================
           11. 画面描画ループ
           ========================================================= */
        function drawStatusBar(x, y, width, height, current, max, label, fillColor, centerText = null, textColor = "#ffffff") {
            ctx.save();
            ctx.font = "bold 14px 'M PLUS Rounded 1c', sans-serif";
            ctx.textAlign = "left";
            ctx.strokeStyle = nightMode ? "#000000" : "rgba(255, 255, 255, 0.85)";
            ctx.lineWidth = 3;
            ctx.strokeText(label, x, y - 5);
            ctx.fillStyle = nightMode ? "#ffffff" : "#111111";
            ctx.fillText(label, x, y - 5);

            ctx.fillStyle = "rgba(0, 0, 0, 0.35)";
            ctx.strokeStyle = nightMode ? "#ffffff" : "#111111";
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.roundRect(x, y, width, height, 6);
            ctx.fill();
            ctx.stroke();

            let ratio = Math.max(0, Math.min(1, current / max));
            if (ratio > 0) {
                ctx.fillStyle = fillColor;
                ctx.beginPath();
                ctx.roundRect(x + 2, y + 2, (width - 4) * ratio, height - 4, 4);
                ctx.fill();
            }

            if (centerText !== null) {
                ctx.font = "bold 12px 'M PLUS Rounded 1c', sans-serif";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.strokeStyle = "rgba(0, 0, 0, 0.65)";
                ctx.lineWidth = 2.5;
                ctx.strokeText(centerText, x + width / 2, y + height / 2 + 0.5);
                ctx.fillStyle = textColor;
                ctx.fillText(centerText, x + width / 2, y + height / 2 + 0.5);
            }
            ctx.restore();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (nightMode) {
                ctx.fillStyle = "#0c1428";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                stars.forEach(s => {
                    let alpha = s.baseAlpha + Math.sin(Date.now() * s.twinkleSpeed) * s.twinkleAmplitude;
                    ctx.globalAlpha = Math.max(0.1, Math.min(0.6, alpha));
                    ctx.fillStyle = "#ffffff";
                    ctx.beginPath();
                    ctx.arc(s.x % canvas.width, s.y, s.size, 0, Math.PI * 2);
                    ctx.fill();
                });
                ctx.globalAlpha = 1.0;

                let moonX = canvas.width - 150;
                let moonY = 75;
                let moonRadius = 26;

                ctx.save();
                ctx.fillStyle = "rgba(255, 250, 237, 0.9)";
                ctx.beginPath();
                ctx.arc(moonX, moonY, moonRadius, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = "rgba(150, 130, 100, 0.65)";
                ctx.beginPath();
                ctx.arc(moonX - 7, moonY - 1, 6.5, 0, Math.PI * 2);
                ctx.arc(moonX - 10, moonY - 8, 3.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.ellipse(moonX - 15, moonY + 1, 5, 2.5, 0.2, 0, Math.PI * 2);
                ctx.fill();

                ctx.beginPath();
                ctx.arc(moonX + 7, moonY + 5, 5.5, 0, Math.PI * 2);
                ctx.arc(moonX + 9, moonY - 1, 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.ellipse(moonX + 14, moonY + 7, 4.5, 2, -0.2, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            } else {
                ctx.fillStyle = "#87CEEB";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            ctx.save();
            ctx.translate(-cameraX, 0);

            ctx.fillStyle = nightMode ? "#1e382b" : "#4a8563";
            ctx.beginPath();
            ctx.moveTo(cameraX, 300);
            for (let i = 0; i <= worldWidth; i += 200) {
                ctx.lineTo(i, 180 + Math.sin(i * 0.005) * 50);
            }
            ctx.lineTo(cameraX + canvas.width, 300);
            ctx.fill();

            ctx.fillStyle = nightMode ? "#16281e" : "#2d5a3f";
            ctx.beginPath();
            ctx.moveTo(cameraX, 300);
            for (let i = 0; i <= worldWidth; i += 120) {
                ctx.lineTo(i, 220 + Math.cos(i * 0.01) * 35);
            }
            ctx.lineTo(cameraX + canvas.width, 300);
            ctx.fill();

            ctx.fillStyle = nightMode ? "#332211" : "#5c4033";
            ctx.fillRect(0, 300, worldWidth, 100);
            ctx.fillStyle = nightMode ? "#1b4d1b" : "#228B22";
            ctx.fillRect(0, 300, worldWidth, 15);

            rocks.forEach(drawRock);
            woods.forEach(w => { if (!w.collected) drawLog(w.x, w.y); });

            carrots.forEach(c => {
                if (c.timer > c.life - 90 && Math.floor(c.timer / 6) % 2 === 0) return;
                drawCarrot(c.x, c.y, Math.sin(c.timer * 0.1) * 3, c.isGolden);
            });

            enemies.forEach(drawHedgehog);

            knockedEnemies.forEach(ke => {
                ctx.save();
                ctx.translate(ke.x + 17, ke.y + 10);
                ctx.rotate(ke.rot);
                ctx.translate(-17, -10);
                drawHedgehog({ x: 0, y: 0, dir: 1, walkTimer: 0, isBlinking: false });
                ctx.restore();
            });

            let blockWidth = 40;
            let pulse = 0.22 + Math.sin(Date.now() * 0.005) * 0.1;
            let beamGrad = ctx.createLinearGradient(0, 150, 0, 300);
            beamGrad.addColorStop(0, "rgba(255, 240, 100, 0)");
            beamGrad.addColorStop(1, `rgba(255, 240, 100, ${pulse})`);
            ctx.fillStyle = beamGrad;
            ctx.fillRect(damX - 10, 150, blockWidth + 20, 150);

            let maxBlocks = 10;
            let currentBlocks = Math.max(0, Math.ceil((damHp / 100) * maxBlocks));
            let blockHeight = 10;
            let totalWoodHeight = currentBlocks * blockHeight;
            let waterOffset = (damHp > 0) ? 6 : 0;
            let currentWaterHeight = Math.max(0, totalWoodHeight - waterOffset);
            let waterY = 300 - currentWaterHeight;

            for (let i = 0; i < currentBlocks; i++) {
                let bx = damX;
                let by = 300 - ((i + 1) * blockHeight);
                ctx.fillStyle = (damHp <= 30) ? "#a83224" : "#8B4513";
                ctx.fillRect(bx, by, blockWidth, blockHeight);
                ctx.strokeStyle = "#3d1c02";
                ctx.lineWidth = 1.5;
                ctx.strokeRect(bx, by, blockWidth, blockHeight);

                ctx.fillStyle = "#e3b782";
                ctx.beginPath();
                ctx.ellipse(bx + blockWidth, by + blockHeight / 2, 2, 3.5, 0, 0, Math.PI * 2);
                ctx.fill();
            }

            buildSparkles.forEach(sp => drawSparkleStar(sp.x, sp.y, sp.size, sp.alpha));
            babyBeavers.forEach(drawBabyBeaver);

            if (currentWaterHeight > 0) {
                ctx.fillStyle = nightMode ? "rgba(10, 80, 160, 0.6)" : "rgba(30, 144, 255, 0.5)";
                let waterStartX = damX + blockWidth;
                let waterWidth = worldWidth - waterStartX;
                ctx.fillRect(waterStartX, waterY, waterWidth, currentWaterHeight);
                ctx.strokeStyle = "rgba(255, 255, 255, 0.7)";
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(waterStartX, waterY);
                ctx.lineTo(waterStartX + waterWidth, waterY);
                ctx.stroke();
            }

            let activeRankIdx = getRankIndexFromMs(survivalTimeMs);
            updateAndDrawBeaverAura(activeRankIdx);
            drawBeaver(beaver);

            tailShockwaves.forEach(sw => {
                ctx.save();
                ctx.globalAlpha = Math.max(0, sw.alpha);
                ctx.strokeStyle = activeRankIdx >= 10 ? "#80ffff" : (activeRankIdx >= 6 ? "#ffee58" : "#ffdd33");
                ctx.lineWidth = 5;
                ctx.beginPath();
                let startAng = (sw.dir === 1) ? -0.9 : (Math.PI - 0.9);
                let endAng = (sw.dir === 1) ? 0.9 : (Math.PI + 0.9);
                ctx.arc(sw.x, sw.y, sw.radius, startAng, endAng);
                ctx.stroke();
                ctx.restore();
            });

            healEffects.forEach(he => {
                ctx.save();
                ctx.globalAlpha = he.alpha;
                ctx.font = "bold 20px 'M PLUS Rounded 1c', sans-serif";
                ctx.textAlign = "center";
                ctx.fillStyle = "#33ff66";
                ctx.strokeStyle = "#003300";
                ctx.lineWidth = 4;
                ctx.strokeText(he.text, he.x, he.y);
                ctx.fillText(he.text, he.x, he.y);
                ctx.restore();
            });

            damageEffects.forEach(de => {
                ctx.save();
                ctx.globalAlpha = de.alpha;
                ctx.font = "bold 20px 'M PLUS Rounded 1c', sans-serif";
                ctx.textAlign = "center";
                ctx.fillStyle = "#ffcc00";
                ctx.strokeStyle = "#aa0000";
                ctx.lineWidth = 4;
                ctx.strokeText(de.text, de.x, de.y);
                ctx.fillText(de.text, de.x, de.y);
                ctx.restore();
            });

            ctx.restore();

            if (!nightMode) {
                clouds.forEach(cloud => {
                    let screenX = cloud.x - (cameraX * 0.3);
                    while (screenX < -150) screenX += worldWidth + 300;
                    while (screenX > canvas.width + 150) screenX -= worldWidth + 300;
                    drawCloud(screenX, cloud.y, cloud.scale);
                });
            }

            drawStatusBar(16, 46, 132, 20, hp, maxHp, "ビーバーHP", "#ff3344", String(Math.ceil(hp)), "#ffffff");
            let damBarColor = damHp <= 30 ? "#ff6600" : "#33cc44";
            drawStatusBar(16, 88, 132, 20, damHp, maxDamHp, "ダム耐久度", damBarColor, Math.ceil(damHp) + "%", "#ffffff");

            let activeRankName = BEAVER_RANKS[activeRankIdx];
            ctx.save();
            ctx.font = "bold 12px 'M PLUS Rounded 1c', sans-serif";
            ctx.textAlign = "left";
            ctx.strokeStyle = nightMode ? "#000000" : "rgba(255, 255, 255, 0.85)";
            ctx.lineWidth = 3;

            let woodText = `所持丸太: ${woodCount} / 4`;
            let waveKillText = `WAVE ${waveLevel}  |  撃退: ${killCount}匹`;

            ctx.strokeText(woodText, 160, 56);
            ctx.fillStyle = nightMode ? "#fff" : "#111";
            ctx.fillText(woodText, 160, 56);

            ctx.strokeText(waveKillText, 160, 76);
            ctx.fillText(waveKillText, 160, 76);

            let rankLabelText = `🏅 ${activeRankName}${invincibleMode ? " [無敵]" : ""}`;
            let rankFill = invincibleMode
                ? "#ffab00"
                : (activeRankIdx >= 10 ? "#66f2ff" : (activeRankIdx >= 6 ? "#ffe54c" : (nightMode ? "#8cf0ff" : "#003d82")));
            ctx.font = "bold 14px 'M PLUS Rounded 1c', sans-serif";
            let measuredRankW = ctx.measureText(rankLabelText).width;
            let rankBoxW = Math.min(395, Math.max(180, measuredRankW + 22));
            let rankBoxX = 158;
            let rankBoxY = 84;
            let rankBoxH = 28;

            ctx.fillStyle = nightMode ? "rgba(10, 18, 32, 0.82)" : "rgba(255, 255, 255, 0.88)";
            ctx.strokeStyle = nightMode ? "rgba(127, 232, 255, 0.7)" : "rgba(17, 17, 17, 0.38)";
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.roundRect(rankBoxX, rankBoxY, rankBoxW, rankBoxH, 7);
            ctx.fill();
            ctx.stroke();

            ctx.strokeStyle = nightMode ? "#000000" : "rgba(255, 255, 255, 0.9)";
            ctx.lineWidth = 3;
            ctx.strokeText(rankLabelText, rankBoxX + 10, rankBoxY + 19);
            ctx.fillStyle = rankFill;
            ctx.fillText(rankLabelText, rankBoxX + 10, rankBoxY + 19);
            ctx.restore();

            ctx.save();
            ctx.textAlign = "center";
            ctx.font = "bold 24px 'M PLUS Rounded 1c', sans-serif";
            ctx.fillStyle = "#ffff33";
            ctx.strokeStyle = "#000000";
            ctx.lineWidth = 5;
            ctx.strokeText("DEFENSE: " + formatTime(survivalTimeMs), canvas.width / 2 + 45, 34);
            ctx.fillText("DEFENSE: " + formatTime(survivalTimeMs), canvas.width / 2 + 45, 34);
            ctx.restore();

            if (damX - cameraX > canvas.width - 30) {
                ctx.save();
                ctx.fillStyle = "rgba(0,0,0,0.65)";
                ctx.beginPath();
                ctx.roundRect(canvas.width - 135, 72, 125, 28, 6);
                ctx.fill();
                ctx.fillStyle = damHp <= 35 ? "#ff5555" : "#ffff66";
                ctx.font = "bold 12px 'M PLUS Rounded 1c', sans-serif";
                ctx.textAlign = "center";
                ctx.fillText(`ダム耐久 ${Math.ceil(damHp)}% ▶`, canvas.width - 72, 90);
                ctx.restore();
            }

            if (rankUpBannerTimer > 0) {
                let alpha = Math.min(1, rankUpBannerTimer / 25);
                let bannerStr = `🎉 ランクアップ！${rankUpBannerText}！`;
                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.font = "bold 20px 'M PLUS Rounded 1c', sans-serif";
                let textW = ctx.measureText(bannerStr).width;
                let boxW = Math.min(620, textW + 36);
                let bannerCenterX = Math.min(canvas.width - boxW / 2 - 12, Math.max(boxW / 2 + 12, canvas.width / 2 + 75));
                let bannerY = 136;

                ctx.fillStyle = "rgba(18, 22, 30, 0.84)";
                ctx.strokeStyle = "rgba(255, 204, 0, 0.9)";
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.roundRect(bannerCenterX - boxW / 2, bannerY - 22, boxW, 34, 10);
                ctx.fill();
                ctx.stroke();

                ctx.textAlign = "center";
                ctx.fillStyle = "#ffe047";
                ctx.strokeStyle = "#000000";
                ctx.lineWidth = 4;
                ctx.strokeText(bannerStr, bannerCenterX, bannerY + 2);
                ctx.fillText(bannerStr, bannerCenterX, bannerY + 2);
                ctx.restore();
            }

            if (!gameStarted && !gameOver) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.45)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.save();
                ctx.textAlign = "center";
                ctx.font = "bold 30px 'M PLUS Rounded 1c', sans-serif";
                ctx.fillStyle = "#ffcc00";
                ctx.strokeStyle = "#000000";
                ctx.lineWidth = 6;
                ctx.strokeText("「ゲームスタート」を押して開始！", canvas.width / 2, canvas.height / 2 - 12);
                ctx.fillText("「ゲームスタート」を押して開始！", canvas.width / 2, canvas.height / 2 - 12);

                ctx.font = "bold 16px 'M PLUS Rounded 1c', sans-serif";
                ctx.fillStyle = "#ffffff";
                ctx.lineWidth = 4;
                ctx.strokeText("別タブを開いている間はタイムカウントが自動で止まります", canvas.width / 2, canvas.height / 2 + 24);
                ctx.fillText("別タブを開いている間はタイムカウントが自動で止まります", canvas.width / 2, canvas.height / 2 + 24);
                ctx.restore();
            }

            if (gameStarted && !gameOver && isTabPaused) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.55)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.save();
                ctx.textAlign = "center";
                ctx.font = "bold 28px 'M PLUS Rounded 1c', sans-serif";
                ctx.fillStyle = "#00ffff";
                ctx.strokeStyle = "#000000";
                ctx.lineWidth = 5;
                ctx.strokeText("⏸ 一時停止中（タブ復帰で再開）", canvas.width / 2, canvas.height / 2);
                ctx.fillText("⏸ 一時停止中（タブ復帰で再開）", canvas.width / 2, canvas.height / 2);
                ctx.restore();
            }

            if (nightModeMsgTimer > 0) {
                ctx.save();
                ctx.textAlign = "center";
                ctx.font = "bold 22px 'M PLUS Rounded 1c', sans-serif";
                ctx.fillStyle = "#00ffff";
                ctx.strokeStyle = "#000000";
                ctx.lineWidth = 4;
                let modeText = nightMode ? "🌙 夜がやってきた！気をつけて！ 🌙" : "☀️ 朝日が昇った！ ☀️";
                ctx.strokeText(modeText, canvas.width / 2, 178);
                ctx.fillText(modeText, canvas.width / 2, 178);
                ctx.restore();
            }

            if (showStartText) {
                ctx.save();
                ctx.font = "bold 34px 'M PLUS Rounded 1c', sans-serif";
                ctx.textAlign = "center";
                ctx.fillStyle = "#ffcc00";
                ctx.strokeStyle = "#000000";
                ctx.lineWidth = 6;
                ctx.strokeText("🛡️ ダムを守り抜け！！ 🛡️", canvas.width / 2, canvas.height / 2 - 20);
                ctx.fillText("🛡️ ダムを守り抜け！！ 🛡️", canvas.width / 2, canvas.height / 2 - 20);
                ctx.restore();
            }

            if (gameOver) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.72)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.save();
                ctx.textAlign = "center";
                ctx.fillStyle = "#ff4444";
                ctx.strokeStyle = "#000000";
                ctx.lineWidth = 6;
                ctx.font = "bold 38px 'M PLUS Rounded 1c', sans-serif";
                ctx.strokeText("GAME OVER", canvas.width / 2, 155);
                ctx.fillText("GAME OVER", canvas.width / 2, 155);

                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 17px 'M PLUS Rounded 1c', sans-serif";
                ctx.strokeText(gameOverReason, canvas.width / 2, 190);
                ctx.fillText(gameOverReason, canvas.width / 2, 190);

                ctx.fillStyle = "#7fe8ff";
                ctx.font = "bold 18px 'M PLUS Rounded 1c', sans-serif";
                ctx.strokeText(`到達ランク: ${activeRankName}`, canvas.width / 2, 220);
                ctx.fillText(`到達ランク: ${activeRankName}`, canvas.width / 2, 220);

                ctx.fillStyle = "#ffff66";
                ctx.font = "bold 20px 'M PLUS Rounded 1c', sans-serif";
                ctx.strokeText(`防衛タイム: ${finalTimeString} / 撃退数: ${killCount}匹`, canvas.width / 2, 252);
                ctx.fillText(`防衛タイム: ${finalTimeString} / 撃退数: ${killCount}匹`, canvas.width / 2, 252);
                ctx.restore();
            }
        }

        function loop(now) {
            update(now);
            draw();
            requestAnimationFrame(loop);
        }

        window.addEventListener("DOMContentLoaded", async () => {
            renderRankChips();
            updateSoundButtonUI();
            restartGame();
            requestAnimationFrame(loop);
            try {
                let ranking = await getCloudRanking();
                updateRankingDisplay(ranking);
            } catch (e) {
                console.error("初期ランキング読込エラー:", e);
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ビーバー・サバイバル防衛戦</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        body {
            margin: 0;
            padding: 10px 8px 24px;
            background: linear-gradient(180deg, #1b2838 0%, #0f1722 100%);
            color: #ffffff;
            font-family: 'M PLUS Rounded 1c', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        h1 {
            margin: 4px 0 8px;
            font-size: clamp(18px, 4.2vw, 26px);
            color: #ffd54f;
            text-shadow: 0 2px 4px rgba(0,0,0,0.7);
            text-align: center;
        }
        .top-controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-bottom: 8px;
            width: 100%;
            max-width: 800px;
        }
        .ctrl-btn {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            font-size: 14px;
            font-weight: 800;
            padding: 8px 14px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            color: #fff;
            box-shadow: 0 3px 0 rgba(0,0,0,0.4);
            transition: transform 0.08s;
        }
        .ctrl-btn:active {
            transform: translateY(2px);
        }
        .ctrl-btn:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }
        #startBtn { background: #2e7d32; }
        #restartBtn { background: #c62828; }
        #rankingBtn { background: #ef6c00; }

        .canvas-wrapper {
            position: relative;
            width: 100%;
            max-width: 800px;
            border: 3px solid #5d4037;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            background: #87CEEB;
        }
        canvas {
            display: block;
            width: 100%;
            height: auto;
        }

        /* 小型スピーカーアイコン専用ボタン（文字なし・タイムと被らないサイズ） */
        #soundToggleBtn {
            position: absolute;
            top: 6px;
            right: 6px;
            z-index: 20;
            width: 30px;
            height: 30px;
            padding: 0;
            border-radius: 7px;
            border: 1.5px solid rgba(255, 255, 255, 0.75);
            background: rgba(15, 23, 34, 0.72);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.45);
        }
        #soundToggleBtn:active {
            transform: scale(0.94);
        }
        #soundToggleBtn svg {
            width: 17px;
            height: 17px;
            display: block;
        }

        .touch-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 800px;
            margin-top: 10px;
            gap: 10px;
        }
        .move-pad, .action-pad {
            display: flex;
            gap: 10px;
        }
        .pad-btn {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            font-size: 16px;
            font-weight: 800;
            min-width: 68px;
            height: 54px;
            padding: 0 14px;
            border: 2px solid rgba(255,255,255,0.25);
            border-radius: 12px;
            color: #fff;
            background: #2b3e50;
            box-shadow: 0 4px 0 #16222d;
            cursor: pointer;
        }
        .pad-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #16222d;
        }
        #jumpBtn { background: #1565c0; }
        #tailBtn { background: #d84315; }

        .rank-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 5px;
            max-width: 800px;
            margin-top: 12px;
        }
        .rank-chip {
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 999px;
            background: rgba(255,255,255,0.1);
            color: #cfd8dc;
            border: 1px solid rgba(255,255,255,0.15);
        }
        .rank-chip.active {
            background: #ffd54f;
            color: #1b2838;
            font-weight: 800;
            border-color: #fff;
        }

        .guide-box {
            max-width: 800px;
            width: 100%;
            margin-top: 12px;
            padding: 10px 14px;
            border-radius: 10px;
            background: rgba(255,255,255,0.07);
            font-size: 12.5px;
            line-height: 1.6;
            color: #e0e0e0;
        }

        /* モーダル共通 */
        .modal-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.72);
            z-index: 100;
            padding: 16px;
            overflow-y: auto;
        }
        .modal-box {
            max-width: 480px;
            margin: 30px auto;
            background: #1e293b;
            border: 2px solid #ffd54f;
            border-radius: 14px;
            padding: 18px;
            color: #fff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .modal-header h2 {
            margin: 0;
            font-size: 19px;
            color: #ffd54f;
        }
        .close-btn {
            background: #475569;
            border: none;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            padding: 4px 10px;
            cursor: pointer;
        }
        #resultMessage {
            display: none;
            background: rgba(255,255,255,0.1);
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
            font-size: 14px;
            line-height: 1.5;
        }
        #nameEntryArea {
            display: none;
            margin-bottom: 12px;
        }
        .entry-row {
            display: flex;
            gap: 8px;
            margin-top: 6px;
        }
        #nameInput {
            flex: 1;
            padding: 8px 10px;
            border-radius: 6px;
            border: 1px solid #94a3b8;
            font-family: inherit;
            font-size: 14px;
        }
        #registerBtn {
            background: #2e7d32;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 8px 16px;
            font-weight: 800;
            cursor: pointer;
        }
        .ranking-list {
            max-height: 320px;
            overflow-y: auto;
            background: rgba(15, 23, 42, 0.75);
            border-radius: 8px;
            padding: 8px;
        }
        .rank-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 8px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            font-size: 13px;
            gap: 6px;
        }
        .rank-row:last-child {
            border-bottom: none;
        }
        .rank-num {
            font-weight: 800;
            color: #ffd54f;
            min-width: 42px;
        }
        .rank-name {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .rank-score {
            font-weight: 800;
            color: #7fe8ff;
        }

        /* テスト・開発者パネル */
        .dev-panel {
            background: #0f172a;
            border: 1px solid #38bdf8;
            border-radius: 10px;
            padding: 12px;
            margin-top: 10px;
            font-size: 13px;
        }
        .dev-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            gap: 8px;
        }
        .dev-row input[type="number"] {
            width: 80px;
            padding: 4px;
            border-radius: 4px;
            border: 1px solid #64748b;
        }
    </style>
</head>
<body>

    <h1>🦫 ビーバー・サバイバル防衛戦 🛡️</h1>

    <div class="top-controls">
        <button id="startBtn" class="ctrl-btn" onclick="startGame()">▶ ゲームスタート</button>
        <button id="restartBtn" class="ctrl-btn" onclick="restartGame()">🔄 やり直す</button>
        <button id="rankingBtn" class="ctrl-btn" onclick="openRankingModal(false)">🏆 ランキング</button>
    </div>

    <div class="canvas-wrapper">
        <button id="soundToggleBtn" onclick="toggleSound()" aria-label="サウンド切替" title="サウンド切替"></button>
        <canvas id="gameCanvas" width="800" height="400"></canvas>
    </div>

    <div class="touch-controls">
        <div class="move-pad">
            <button id="leftBtn" class="pad-btn">◀ 左</button>
            <button id="rightBtn" class="pad-btn">右 ▶</button>
        </div>
        <div class="action-pad">
            <button id="tailBtn" class="pad-btn">💥 しっぽ</button>
            <button id="jumpBtn" class="pad-btn">⬆ ジャンプ</button>
        </div>
    </div>

    <div id="rankChipBar" class="rank-bar"></div>

    <div class="guide-box">
        <b>【遊び方】</b> 丸太を拾って右端のダムまで運び、ダムの耐久度を保ちながらハリネズミを「しっぽ攻撃（Z / X / Enter / 💥ボタン）」で撃退しよう！<br>
        ニンジンを食べるとHP回復、<b>金の巨大ニンジン</b>はHP全回復！別タブを開くとタイムは自動停止します。
    </div>

    <!-- ランキングモーダル -->
    <div id="rankingModal" class="modal-backdrop">
        <div class="modal-box">
            <div class="modal-header">
                <h2 id="modalTitle" onclick="onRankingTitleClick()">🏆 サバイバル防衛ランキング</h2>
                <button class="close-btn" onclick="closeRankingModal()">✕</button>
            </div>
            <div id="resultMessage"></div>
            <div id="nameEntryArea">
                <div style="font-size:13px; color:#cbd5e1;">ランキングに記録を登録できます（最大50位まで表示）</div>
                <div class="entry-row">
                    <input type="text" id="nameInput" maxlength="12" placeholder="名前を入力（12文字まで）" onkeydown="if(event.key==='Enter') saveScore()">
                    <button id="registerBtn" onclick="saveScore()">登録</button>
                </div>
            </div>
            <div id="rankingList" class="ranking-list">読み込み中...</div>
        </div>
    </div>

    <!-- 隠し設定モーダル -->
    <div id="keywordModal" class="modal-backdrop">
        <div class="modal-box">
            <div class="modal-header">
                <h2>🔧 テスト調整パネル</h2>
                <button class="close-btn" onclick="closeKeywordModal()">✕</button>
            </div>
            <div id="keywordAuthArea">
                <p style="font-size:13px;">合言葉を入力してください：</p>
                <div class="entry-row">
                    <input type="password" id="secretKeywordInput" placeholder="合言葉">
                    <button class="ctrl-btn" style="background:#0284c7;" onclick="verifySecretKeyword()">解除</button>
                </div>
            </div>
            <div id="testControlArea" style="display:none;" class="dev-panel">
                <div class="dev-row">
                    <label><input type="checkbox" id="invincibleCheck" onchange="invincibleMode = this.checked"> 無敵モード（HP・ダム減らない）</label>
                </div>
                <div class="dev-row">
                    <span>ビーバー移動速度:</span>
                    <input type="number" id="paramSpeed" step="0.2" value="4.8">
                </div>
                <div class="dev-row">
                    <span>しっぽリーチ:</span>
                    <input type="number" id="paramReach" step="5" value="62">
                </div>
                <div class="dev-row">
                    <span>しっぽHP消費:</span>
                    <input type="number" id="paramTailCost" step="1" value="3">
                </div>
                <div class="dev-row">
                    <span>敵スピード倍率:</span>
                    <input type="number" id="paramEnemySpeed" step="0.1" value="1.0">
                </div>
                <div class="dev-row">
                    <span>ダム自然劣化倍率:</span>
                    <input type="number" id="paramDamWear" step="0.1" value="1.0">
                </div>
                <div style="text-align:right; margin-top:8px;">
                    <button class="ctrl-btn" style="background:#2e7d32;" onclick="applyTestParams()">設定反映</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        /* =========================================================
           1. Firebase 初期化（ご自身の設定値に置き換えてください）
           ========================================================= */
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        let db = null;
        try {
            if (firebaseConfig.apiKey !== "YOUR_API_KEY") {
                firebase.initializeApp(firebaseConfig);
                db = firebase.firestore();
            }
        } catch (e) {
            console.warn("Firebase未設定または初期化スキップ:", e);
        }

        const rankingCollectionName = "beaver_survival_ranking";
        const playLogCollectionName = "survival_play_logs";

        /* =========================================================
           2. ランク定義・隠しコマンド・テスト変数
           ========================================================= */
        const BEAVER_RANKS = [
            "見習いビーバー",       // 0: 0s~
            "一人前ビーバー",       // 1: 15s~
            "熟練のダム職人",       // 2: 30s~
            "森林の守護者",         // 3: 45s~
            "清流の防衛隊長",       // 4: 60s~
            "伝説の建築家",         // 5: 80s~
            "黄金のしっぽ使い",     // 6: 100s~ (オーラ解放)
            "不落のダム英雄",       // 7: 125s~
            "大自然の覇者",         // 8: 150s~
            "神話のビーバー王",     // 9: 180s~
            "超越せし神ビーバー"    // 10: 220s~ (極限オーラ)
        ];

        const RANK_THRESHOLDS_SEC = [0, 15, 30, 45, 60, 80, 100, 125, 150, 180, 220];

        function getRankIndexFromMs(ms) {
            let sec = Math.floor(ms / 1000);
            let idx = 0;
            for (let i = 0; i < RANK_THRESHOLDS_SEC.length; i++) {
                if (sec >= RANK_THRESHOLDS_SEC[i]) idx = i;
            }
            return idx;
        }

        function getRankNameFromMs(ms) {
            return BEAVER_RANKS[getRankIndexFromMs(ms)];
        }

        function renderRankChips() {
            const bar = document.getElementById("rankChipBar");
            if (!bar) return;
            bar.innerHTML = BEAVER_RANKS.map((name, i) =>
                `<span class="rank-chip" id="rankChip_${i}">${name} (${RANK_THRESHOLDS_SEC[i]}秒)</span>`
            ).join("");
        }

        function highlightActiveRankChip() {
            let idx = getRankIndexFromMs(survivalTimeMs);
            BEAVER_RANKS.forEach((_, i) => {
                const el = document.getElementById(`rankChip_${i}`);
                if (el) el.classList.toggle("active", i === idx);
            });
        }

        let nightMode = false;
        let nightModeMsgTimer = 0;
        let secretClickCount = 0;
        let rankingTitleClickCount = 0;
        let tabPauseCount = 0;
        let invincibleMode = false;
        let testModeUsed = false;

        let testParams = {
            beaverSpeed: 4.8,
            tailReach: 62,
            tailHpCost: 3,
            enemySpeedMult: 1.0,
            damWearMult: 1.0,
            fixedEnemyInterval: 0
        };

        function toggleNightMode(showNotice = false) {
            nightMode = !nightMode;
            if (showNotice) nightModeMsgTimer = 110;
        }

        let cmdSeq = [];
        function onCommandAction(act) {
            cmdSeq.push(act);
            if (cmdSeq.length > 6) cmdSeq.shift();
            if (cmdSeq.join(",") === "left,left,right,right,jump,jump") {
                cmdSeq = [];
                openKeywordModal();
            }
        }

        function onRankingTitleClick() {
            rankingTitleClickCount++;
            if (rankingTitleClickCount >= 7) {
                rankingTitleClickCount = 0;
                closeRankingModal();
                openKeywordModal();
            }
        }

        function openKeywordModal() {
            document.getElementById("keywordModal").style.display = "block";
        }

        function closeKeywordModal() {
            document.getElementById("keywordModal").style.display = "none";
        }

        function verifySecretKeyword() {
            const val = document.getElementById("secretKeywordInput").value.trim();
            if (val === "beaver777") {
                testModeUsed = true;
                document.getElementById("keywordAuthArea").style.display = "none";
                document.getElementById("testControlArea").style.display = "block";
            } else {
                alert("合言葉が違います");
            }
        }

        function applyTestParams() {
            testModeUsed = true;
            testParams.beaverSpeed = parseFloat(document.getElementById("paramSpeed").value) || 4.8;
            testParams.tailReach = parseFloat(document.getElementById("paramReach").value) || 62;
            testParams.tailHpCost = parseFloat(document.getElementById("paramTailCost").value) || 0;
            testParams.enemySpeedMult = parseFloat(document.getElementById("paramEnemySpeed").value) || 1.0;
            testParams.damWearMult = parseFloat(document.getElementById("paramDamWear").value) || 1.0;
            closeKeywordModal();
        }

        /* =========================================================
           3. Firestore ランキング（50位まで）＆プレイログ保存
           ========================================================= */
        async function getCloudRanking() {
            if (!db) {
                let local = JSON.parse(localStorage.getItem("beaver_local_ranking") || "[]");
                local.sort((a, b) => (b.survivalMs || 0) - (a.survivalMs || 0));
                return local.slice(0, 50);
            }
            let snapshot = await db.collection(rankingCollectionName)
                .orderBy("survivalMs", "desc")
                .limit(50)
                .get();
            let list = [];
            snapshot.forEach(doc => list.push(doc.data()));
            return list;
        }

        async function saveCloudScore(playerName, survivalMs, timeStr, kills, repairs) {
            const record = {
                name: playerName,
                survivalMs: Math.floor(survivalMs),
                timeString: timeStr,
                kills: kills,
                repairs: repairs,
                rankTitle: getRankNameFromMs(survivalMs),
                createdAt: new Date().toISOString()
            };
            if (!db) {
                let local = JSON.parse(localStorage.getItem("beaver_local_ranking") || "[]");
                local.push(record);
                local.sort((a, b) => (b.survivalMs || 0) - (a.survivalMs || 0));
                localStorage.setItem("beaver_local_ranking", JSON.stringify(local.slice(0, 50)));
                return;
            }
            await db.collection(rankingCollectionName).add(record);
        }

        async function savePlayLog(playerName) {
            if (!db) return;
            try {
                await db.collection(playLogCollectionName).add({
                    name: playerName,
                    survivalMs: Math.floor(survivalTimeMs),
                    timeString: finalTimeString,
                    kills: killCount,
                    repairs: repairCount,
                    tabPauseCount: tabPauseCount,
                    testModeUsed: testModeUsed || invincibleMode,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
            } catch (e) {
                console.warn("ログ保存エラー:", e);
            }
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;");
        }

        function updateRankingDisplay(ranking) {
            const listEl = document.getElementById("rankingList");
            if (!listEl) return;
            if (!ranking || ranking.length === 0) {
                listEl.innerHTML = `<div style="text-align:center; padding:16px; color:#94a3b8;">まだ記録がありません。最初の防衛者になろう！</div>`;
                return;
            }
            listEl.innerHTML = ranking.slice(0, 50).map((item, idx) => {
                let medal = idx === 0 ? "🥇" : (idx === 1 ? "🥈" : (idx === 2 ? "🥉" : `${idx + 1}位`));
                return `
                    <div class="rank-row">
                        <span class="rank-num">${medal}</span>
                        <span class="rank-name">${escapeHtml(item.name || "名無しさん")}</span>
                        <span class="rank-score">${escapeHtml(item.timeString || formatTime(item.survivalMs || 0))}</span>
                    </div>
                `;
            }).join("");
        }

        /* =========================================================
           4. サウンド制御（小型スピーカーアイコン切り替え）
           ========================================================= */
        let audioCtx = null;
        let masterGain = null;
        let soundEnabled = true;
        const SOUND_VOLUME_BOOST = 1.15;
        let frameTailHitCount = 0;

        const SPEAKER_ON_SVG = `
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor"></polygon>
                <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
            </svg>
        `;

        const SPEAKER_OFF_SVG = `
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor" opacity="0.55"></polygon>
                <line x1="22" y1="2" x2="2" y2="22" stroke="#ff6b6b" stroke-width="2.5"></line>
            </svg>
        `;

        function updateSoundButtonUI() {
            const btn = document.getElementById("soundToggleBtn");
            if (!btn) return;
            btn.innerHTML = soundEnabled ? SPEAKER_ON_SVG : SPEAKER_OFF_SVG;
            btn.setAttribute("aria-pressed", soundEnabled ? "true" : "false");
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            updateSoundButtonUI();
            if (soundEnabled) {
                initAudio();
            } else if (masterGain && audioCtx) {
                masterGain.gain.setValueAtTime(0.0, audioCtx.currentTime);
            }
        }

        function initAudio() {
            if (!audioCtx) {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (!AudioContextClass) return;
                audioCtx = new AudioContextClass();
                masterGain = audioCtx.createGain();
                masterGain.gain.setValueAtTime(soundEnabled ? SOUND_VOLUME_BOOST : 0.0, audioCtx.currentTime);
                masterGain.connect(audioCtx.destination);
            }
            if (masterGain && audioCtx) {

            if (beaver.tailCooldown > 0) return;

            let cost = invincibleMode ? 0 : testParams.tailHpCost;
            if (cost > 0) {
                hp = Math.max(0, hp - cost);
                damageEffects.push({
                    x: beaver.x + 25,
                    y: beaver.y - 12,
                    text: `-${cost} HP!`,
                    alpha: 1.0
                });

                if (hp <= 0) {
                    gameOver = true;
                    gameOverReason = "しっぽ攻撃を使いすぎて体力が尽きてしまった！";
                    return;
                }
            }

            beaver.tailAttackTimer = 14;
            beaver.tailCooldown = 22;
            playTailSwingSound();

            let attackDir = beaver.facing;
            let hitCenterX = (attackDir === 1) ? (beaver.x + beaver.width + 20) : (beaver.x - 20);
            tailShockwaves.push({
                x: hitCenterX,
                y: beaver.y + 42,
                dir: attackDir,
                radius: 14,
                maxRadius: Math.max(56, testParams.tailReach * 0.9),

            });

            keys[e.code] = true;

            if (e.code === "ArrowLeft" || e.code === "KeyA") onCommandAction('left');
            if (e.code === "ArrowRight" || e.code === "KeyD") onCommandAction('right');
            if (e.code === "Space" || e.code === "ArrowUp" || e.code === "KeyW") onCommandAction('jump');
            if (e.code === "KeyZ" || e.code === "KeyX" || e.code === "Enter" || e.code === "ShiftLeft" || e.code === "ShiftRight") {

                    document.getElementById("resultMessage").innerHTML = `✨ 登録完了！ (${playerName}さん)`;
                    document.getElementById("resultMessage").style.display = "block";

            }, 3000);

            try {
                await saveCloudScore(playerName, survivalTimeMs, finalTimeString, killCount, repairCount);
                await savePlayLog(playerName);
                let ranking = await getCloudRanking();
                let userRank = ranking.filter(r => (r.survivalMs || 0) > survivalTimeMs).length + 1;

                clearTimeout(safetyTimer);
                scoreRegistered = true;
                document.getElementById("nameEntryArea").style.display = "none";

        function drawSparkleStar(x, y, size, alpha, color = "#ffffaa") {
            ctx.save();
            ctx.translate(x, y);
            ctx.globalAlpha = Math.max(0, Math.min(1, alpha));
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.moveTo(0, -size);
            ctx.quadraticCurveTo(0, 0, size, 0);
            ctx.quadraticCurveTo(0, 0, 0, size);
            ctx.quadraticCurveTo(0, 0, -size, 0);
            ctx.quadraticCurveTo(0, 0, 0, -size);
            ctx.fill();
            ctx.restore();
        }

        function updateAndDrawBeaverAura(rankIdx) {
            if (rankIdx < 6) {
                auraParticles = [];
                return;
            }

            const isGodExtreme = rankIdx >= 10;
            const cx = beaver.x + beaver.width / 2;
            const cy = beaver.y + beaver.height / 2 + 4;
            const t = Date.now() * 0.008;

            auraSpawnTimer++;
            if (auraSpawnTimer >= (isGodExtreme ? 2 : 3)) {
                auraSpawnTimer = 0;
                const angle = Math.random() * Math.PI * 2;
                const spreadR = 16 + Math.random() * 24;
                auraParticles.push({
                    ox: Math.cos(angle) * spreadR,
                    oy: Math.sin(angle) * spreadR * 0.85,
                    vy: -1.1 - Math.random() * 1.6,
                    vx: (Math.random() - 0.5) * 0.9,
                    size: isGodExtreme ? (4 + Math.random() * 5.5) : (3 + Math.random() * 4),
                    alpha: 1.0,
                    decay: 0.025 + Math.random() * 0.02,
                    isSparkle: isGodExtreme && Math.random() < 0.65,
                    phase: Math.random() * Math.PI * 2
                });
            }

            for (let i = auraParticles.length - 1; i >= 0; i--) {
                let p = auraParticles[i];
                p.ox += p.vx;
                p.oy += p.vy;
                p.alpha -= p.decay;
                if (p.alpha <= 0) {
                    auraParticles.splice(i, 1);
                }
            }

            ctx.save();

            let pulseR = 44 + Math.sin(t * 1.4) * 5;
            let outerGrad = ctx.createRadialGradient(cx, cy, 10, cx, cy, pulseR + 12);
            if (isGodExtreme) {
                outerGrad.addColorStop(0.0, "rgba(180, 250, 255, 0.0)");
                outerGrad.addColorStop(0.55, "rgba(0, 229, 255, 0.28)");
                outerGrad.addColorStop(0.85, "rgba(64, 196, 255, 0.42)");
                outerGrad.addColorStop(1.0, "rgba(0, 176, 255, 0.0)");
            } else {
                outerGrad.addColorStop(0.0, "rgba(255, 250, 150, 0.0)");
                outerGrad.addColorStop(0.55, "rgba(255, 225, 40, 0.25)");
                outerGrad.addColorStop(0.85, "rgba(255, 195, 0, 0.38)");
                outerGrad.addColorStop(1.0, "rgba(255, 160, 0, 0.0)");
            }

            ctx.fillStyle = outerGrad;
            ctx.beginPath();
            ctx.ellipse(cx, cy, pulseR + 8, pulseR + 12, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = isGodExtreme ? "rgba(150, 245, 255, 0.75)" : "rgba(255, 235, 70, 0.72)";
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            const segments = 24;
            for (let s = 0; s <= segments; s++) {
                const a = (s / segments) * Math.PI * 2;
                const wave = Math.sin(a * 5 + t * 2.2) * 4.5 + Math.cos(a * 3 - t * 1.6) * 2.5;
                const rx = (34 + wave);
                const ry = (42 + wave);
                const px = cx + Math.cos(a) * rx;
                const py = cy + Math.sin(a) * ry;
                if (s === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
            ctx.closePath();
            ctx.stroke();

            auraParticles.forEach(p => {
                let px = cx + p.ox;
                let py = cy + p.oy;
                let twinkle = 0.65 + 0.35 * Math.sin(t * 2.5 + p.phase);
                if (p.isSparkle) {
                    drawSparkleStar(px, py, p.size * twinkle, p.alpha, "#e0ffff");
                    drawSparkleStar(px + 3, py - 2, p.size * 0.55, p.alpha * 0.85, "#ffffff");
                } else {
                    ctx.save();
                    ctx.globalAlpha = Math.max(0, Math.min(1, p.alpha * 0.7));
                    ctx.fillStyle = isGodExtreme ? "#64ffda" : "#ffee58";
                    ctx.beginPath();
                    ctx.arc(px, py, p.size * 0.65, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
            });

            ctx.restore();
        }

        function drawCloud(x, y, scale) {

        function drawLog(x, y) {
            ctx.save();

        function drawRock(rock) {
            ctx.save();
            ctx.translate(rock.x, rock.y);

            const outlineColor = "#2c3034";
            const baseColor = "#71797e";
            const highlightColor = "#939b9e";
            const shadowColor = "#4a4f52";

            ctx.lineWidth = 2.5;
            ctx.strokeStyle = outlineColor;

            ctx.fillStyle = baseColor;
            ctx.beginPath();
            if (rock.type === 1) {
                ctx.moveTo(5, rock.height);
                ctx.lineTo(0, rock.height * 0.5);
                ctx.lineTo(12, rock.height * 0.1);
                ctx.lineTo(rock.width * 0.6, 0);
                ctx.lineTo(rock.width - 5, rock.height * 0.3);
                ctx.lineTo(rock.width, rock.height);
            } else if (rock.type === 2) {
                ctx.moveTo(8, rock.height);
                ctx.lineTo(2, rock.height * 0.6);
                ctx.lineTo(rock.width * 0.35, 3);
                ctx.lineTo(rock.width * 0.7, 0);
                ctx.lineTo(rock.width - 2, rock.height * 0.4);
                ctx.lineTo(rock.width - 6, rock.height);
            } else {
                ctx.moveTo(6, rock.height);
                ctx.lineTo(0, rock.height * 0.7);
                ctx.lineTo(15, rock.height * 0.25);
                ctx.lineTo(rock.width * 0.4, 0);
                ctx.lineTo(rock.width * 0.75, rock.height * 0.15);
                ctx.lineTo(rock.width, rock.height * 0.5);
                ctx.lineTo(rock.width - 4, rock.height);
            }
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = highlightColor;
            ctx.beginPath();
            if (rock.type === 1) {
                ctx.moveTo(15, rock.height * 0.2);
                ctx.lineTo(rock.width * 0.5, 8);
                ctx.lineTo(rock.width * 0.6, rock.height * 0.5);
                ctx.lineTo(15, rock.height * 0.6);
            } else if (rock.type === 2) {
                ctx.moveTo(rock.width * 0.35, 12);
                ctx.lineTo(rock.width * 0.65, 8);
                ctx.lineTo(rock.width * 0.7, rock.height * 0.5);
                ctx.lineTo(rock.width * 0.3, rock.height * 0.6);
            } else {
                ctx.moveTo(18, rock.height * 0.3);
                ctx.lineTo(rock.width * 0.4, 8);
                ctx.lineTo(rock.width * 0.7, rock.height * 0.35);
                ctx.lineTo(rock.width * 0.4, rock.height * 0.55);
            }
            ctx.closePath();
            ctx.fill();

            ctx.strokeStyle = shadowColor;
            ctx.lineWidth = 2;
            ctx.beginPath();
            if (rock.type === 1) {
                ctx.moveTo(25, rock.height * 0.4); ctx.lineTo(rock.width * 0.7, rock.height * 0.8);
            } else if (rock.type === 2) {
                ctx.moveTo(rock.width * 0.4, rock.height * 0.4); ctx.lineTo(rock.width * 0.8, rock.height * 0.85);
            } else {
                ctx.moveTo(rock.width * 0.3, rock.height * 0.5); ctx.lineTo(rock.width * 0.65, rock.height * 0.9);
                ctx.moveTo(rock.width * 0.2, rock.height * 0.3); ctx.lineTo(rock.width * 0.1, rock.height * 0.7);
            }
            ctx.stroke();

            ctx.fillStyle = nightMode ? "#254220" : "#3b7a30";
            ctx.beginPath();
            ctx.ellipse(10, rock.height - 4, 7, 3.5, 0, 0, Math.PI * 2);
            ctx.ellipse(rock.width - 12, rock.height - 5, 9, 4, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }
